name: iOS build

# Builds an unsigned .ipa on a GitHub-hosted Mac. Download it from the run's
# "Artifacts" section and install it with Sideloadly (signs it with your Apple ID).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr OneForAllStudio.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OneForAllStudio-ios
          path: OneForAllStudio.ipa
          retention-days: 30
